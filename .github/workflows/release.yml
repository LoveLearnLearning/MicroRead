name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          version: 9.15.1
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Get pnpm store path
        id: pnpm-cache
        shell: pwsh
        run: |
          "store_path=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-release-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web + Desktop bundles (NSIS + portable EXE)
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm build:desktop

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $base = "apps/desktop/src-tauri/target/release"
          $out = @()
          $nsis = Get-ChildItem "$base/bundle/nsis" -Filter "MicroRead_*_x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dst = "MicroRead-v$version-windows-x86_64-setup.exe"
            Copy-Item $nsis.FullName $dst
            $out += $dst
          }
          $exe = "$base/micro-read-desktop.exe"
          if (Test-Path $exe) {
            $dst = "MicroRead-v$version-windows-x86_64-portable.exe"
            Copy-Item $exe $dst
            $out += $dst
          }
          if (-not $out) { throw "No artifacts were produced. Check build logs above." }
          "files=$($out -join '|')" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.collect.outputs.files }}
